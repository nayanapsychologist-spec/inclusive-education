<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEP Foundations & Legal Framework - Indian Inclusive Education</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                            950: '#0f172a'
                        },
                        saffron: {
                            500: '#f97316',
                            600: '#ea580c'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
        }
        /* Custom 3D Card Flip CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        /* Print Styles */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Top Navigation Header -->
    <header class="bg-indigo-950 text-white sticky top-0 z-50 shadow-md border-b border-indigo-800/60 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-saffron-500 to-amber-400 p-2.5 rounded-xl text-white shadow-md">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <span class="text-[11px] font-bold tracking-wider text-saffron-500 uppercase">Advanced Inclusive Education</span>
                    <h1 class="text-base sm:text-lg font-bold leading-tight">IEP Foundations & Legal Framework</h1>
                </div>
            </div>

            <!-- Dashboard Stats & Quick Metrics -->
            <div class="flex items-center space-x-4 sm:space-x-6">
                <!-- XP Badge -->
                <div class="flex items-center space-x-2 bg-indigo-900/80 px-3 py-1.5 rounded-xl border border-indigo-700/50 shadow-inner">
                    <i class="fa-solid fa-trophy text-amber-400 text-sm"></i>
                    <span class="text-xs font-medium text-slate-300">XP Points:</span>
                    <span id="user-xp" class="text-sm font-extrabold text-amber-300">0</span>
                </div>

                <!-- Progress Bar -->
                <div class="hidden sm:flex flex-col w-36">
                    <div class="flex justify-between text-[11px] text-slate-300 mb-1 font-medium">
                        <span>Completion</span>
                        <span id="progress-percent" class="font-bold text-saffron-500">0%</span>
                    </div>
                    <div class="w-full bg-indigo-900 rounded-full h-2 overflow-hidden border border-indigo-700/50">
                        <div id="main-progress-bar" class="bg-gradient-to-r from-saffron-500 to-amber-400 h-2 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <button id="toggle-sidebar-btn" onclick="toggleSidebar()" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg bg-indigo-900">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container Layout -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-full md:w-80 flex-shrink-0 space-y-4 no-print hidden md:block">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sticky top-20">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-indigo-600"></i> Course Modules
                    </h2>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">5 Modules</span>
                </div>

                <!-- Dynamic Module Links -->
                <nav class="space-y-1.5" id="module-nav-list"></nav>

                <!-- Tool Shortcuts Section -->
                <div class="mt-6 pt-4 border-t border-slate-100 space-y-2">
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-2 mb-1">Interactive Tools</h3>
                    <button onclick="switchView('disabilities-explorer')" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition flex items-center gap-2.5">
                        <i class="fa-solid fa-wheelchair text-teal-600 w-4"></i> RPwD 21 Disabilities Explorer
                    </button>
                    <button onclick="switchView('team-matrix')" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition flex items-center gap-2.5">
                        <i class="fa-solid fa-users-gear text-indigo-600 w-4"></i> MDT Role Matrix & RCI
                    </button>
                    <button onclick="switchView('flashcards-tool')" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition flex items-center gap-2.5">
                        <i class="fa-solid fa-clone text-saffron-600 w-4"></i> IEP Components Flashcards
                    </button>
                    <button onclick="switchView('smart-builder-tool')" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition flex items-center gap-2.5">
                        <i class="fa-solid fa-bullseye text-emerald-600 w-4"></i> SMART Goal Generator
                    </button>
                    <button onclick="switchView('case-study-tool')" class="w-full text-left px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition flex items-center gap-2.5">
                        <i class="fa-solid fa-briefcase text-purple-600 w-4"></i> Case Study Decision Engine
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Viewport -->
        <main class="flex-1 min-w-0">
            <div id="content-viewport" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-8 transition-all">
                <!-- Javascript dynamically mounts active content module here -->
            </div>
        </main>
    </div>

    <!-- Application JavaScript -->
    <script>
        const appState = {
            currentModuleIndex: 0,
            completedModules: new Set(),
            xp: 0,
            answers: {},
            activeExplorerFilter: 'ALL',
            flashcardIndex: 0,
            caseStudyStep: 1,
            caseStudyAnswers: {}
        };

        const curriculumData = [
            {
                id: "mod-1",
                title: "1. Legal Mandates & Inclusive Foundations",
                subtext: "RTE Act (2009), RPwD Act (2016), NEP 2020 & Samagra Shiksha Framework.",
                taxonomyLevel: "Remembering & Understanding",
                renderFn: renderModule1
            },
            {
                id: "mod-2",
                title: "2. What is an IEP? Purpose & Multidisciplinary Team",
                subtext: "IEP Definition, Purpose, RCI Credentials & Collaborative MDT Roles.",
                taxonomyLevel: "Understanding & Conceptualizing",
                renderFn: renderModule2
            },
            {
                id: "mod-3",
                title: "3. Core Components of an IEP & Assessment (PLOP)",
                subtext: "Present Levels of Performance (PLAFP), Baselines, and Flashcard Deck.",
                taxonomyLevel: "Analyzing & Assessing",
                renderFn: renderModule3
            },
            {
                id: "mod-4",
                title: "4. SMART Goals & Accommodations vs. Modifications",
                subtext: "Crafting NCF/CBSE Aligned SMART Goals and Board Accommodations.",
                taxonomyLevel: "Applying & Formulating",
                renderFn: renderModule4
            },
            {
                id: "mod-5",
                title: "5. Case Study Application & Practical Synthesis",
                subtext: "Indian Classroom Case Studies, Interactive Decision Engine & Final Assessment.",
                taxonomyLevel: "Evaluating & Synthesizing",
                renderFn: renderModule5
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            renderModuleNav();
            loadModule(0);
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        function renderModuleNav() {
            const container = document.getElementById('module-nav-list');
            container.innerHTML = curriculumData.map((mod, idx) => {
                const isCompleted = appState.completedModules.has(idx);
                const isActive = appState.currentModuleIndex === idx;

                return `
                    <button onclick="loadModule(${idx})" class="w-full text-left p-3 rounded-xl transition text-xs font-semibold flex items-center justify-between ${
                        isActive ? 'bg-indigo-950 text-white shadow-sm' : 'bg-slate-50 hover:bg-slate-100 text-slate-700'
                    }">
                        <div class="flex items-center space-x-2.5 truncate">
                            <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
                                isCompleted ? 'bg-emerald-500 text-white' : (isActive ? 'bg-saffron-500 text-white' : 'bg-slate-200 text-slate-600')
                            }">
                                ${isCompleted ? '<i class="fa-solid fa-check"></i>' : (idx + 1)}
                            </span>
                            <span class="truncate">${mod.title.split(':')[0]}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] opacity-40"></i>
                    </button>
                `;
            }).join('');
        }

        function loadModule(index) {
            appState.currentModuleIndex = index;
            renderModuleNav();
            const viewport = document.getElementById('content-viewport');
            const mod = curriculumData[index];

            viewport.innerHTML = `
                <div class="space-y-6">
                    <div class="border-b border-slate-100 pb-4">
                        <div class="flex items-center justify-between text-xs mb-1">
                            <span class="font-bold text-saffron-600 uppercase tracking-wider">Module ${index + 1} of ${curriculumData.length}</span>
                            <span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">Bloom's: ${mod.taxonomyLevel}</span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold text-indigo-950">${mod.title}</h2>
                        <p class="text-xs text-slate-500 mt-1">${mod.subtext}</p>
                    </div>

                    <div id="module-dynamic-body"></div>

                    <!-- Bottom Nav Controls -->
                    <div class="flex items-center justify-between pt-6 border-t border-slate-100 no-print">
                        <button onclick="loadModule(${Math.max(0, index - 1)})" ${index === 0 ? 'disabled class="opacity-30 cursor-not-allowed text-xs px-4 py-2 border rounded-xl"' : 'class="text-xs font-bold px-4 py-2 border border-slate-300 rounded-xl hover:bg-slate-50 text-slate-700"'}>
                            <i class="fa-solid fa-arrow-left mr-1"></i> Previous
                        </button>
                        
                        ${index < curriculumData.length - 1 ? `
                            <button onclick="loadModule(${index + 1})" class="text-xs font-bold px-4 py-2 bg-indigo-950 text-white rounded-xl hover:bg-indigo-900 transition shadow-sm">
                                Next Module <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        ` : `
                            <button onclick="switchView('certificate-tool')" class="text-xs font-bold px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-500 transition shadow-sm">
                                <i class="fa-solid fa-certificate mr-1"></i> Course Certificate
                            </button>
                        `}
                    </div>
                </div>
            `;

            mod.renderFn(document.getElementById('module-dynamic-body'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // MODULE 1: Legal Foundations
        function renderModule1(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-50 to-slate-50 p-4 sm:p-5 rounded-2xl border border-indigo-100">
                        <h3 class="font-bold text-indigo-950 text-sm sm:text-base flex items-center gap-2">
                            <i class="fa-solid fa-scale-balanced text-saffron-500"></i> Landmark Indian Legislations & National Policies
                        </h3>
                        <p class="text-xs text-slate-600 mt-1 leading-relaxed">
                            Inclusive education in India is anchored in constitutional rights and three major legislative frameworks.
                        </p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <span class="px-2 py-0.5 bg-indigo-100 text-indigo-800 font-bold rounded text-[10px]">RTE Act 2009</span>
                            <h4 class="font-bold text-slate-800 mt-2 text-sm">Right to Education</h4>
                            <p class="text-slate-600 mt-1">Guarantees free & compulsory elementary education. Sec 12(1)(c) reserves 25% seats for disadvantaged groups including children with disabilities.</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <span class="px-2 py-0.5 bg-saffron-100 text-saffron-800 font-bold rounded text-[10px]">RPwD Act 2016</span>
                            <h4 class="font-bold text-slate-800 mt-2 text-sm">Benchmark Rights</h4>
                            <p class="text-slate-600 mt-1">Expanded recognized disabilities from 7 to 21. Chapter III Sec 16 mandates non-discrimination, physical/pedagogical accessibility, and individualized support.</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 font-bold rounded text-[10px]">NEP 2020</span>
                            <h4 class="font-bold text-slate-800 mt-2 text-sm">National Education Policy</h4>
                            <p class="text-slate-600 mt-1">Emphasizes early identification, cross-disability training for teachers, NIOS open schooling options, and Resource Centres under Samagra Shiksha.</p>
                        </div>
                    </div>

                    <!-- Embedded Tool: RPwD 21 Disabilities Explorer -->
                    <div class="border-t border-slate-200 pt-6">
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="font-bold text-indigo-950 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-wheelchair text-teal-600"></i> Interactive Tool: RPwD Act 2016 (21 Benchmark Disabilities)
                            </h4>
                            <span class="text-[11px] text-slate-500">Click categories to filter</span>
                        </div>
                        <div id="explorer-tool-mount"></div>
                    </div>

                    <!-- Mini Assessment Module 1 -->
                    <div class="border-t border-slate-200 pt-6">
                        <div id="quiz-mod-1-mount"></div>
                    </div>
                </div>
            `;

            renderDisabilitiesExplorer(document.getElementById('explorer-tool-mount'));
            renderQuiz(document.getElementById('quiz-mod-1-mount'), 1, {
                question: "According to Chapter III (Section 16) of the RPwD Act 2016, which of the following is legally mandated for recognized schools in India?",
                options: [
                    "A) Denying admission to children with high support needs until special schools accept them.",
                    "B) Providing reasonable accommodations, suitable transport, and barrier-free campuses without discrimination.",
                    "C) Requiring parents to pay double fees for specialized paraprofessional support."
                ],
                correct: 1,
                explanation: "Section 16 explicitly mandates that educational institutions funded or recognized by the government must provide inclusive education, barrier-free infrastructure, and reasonable accommodations without discrimination."
            });
        }

        const disabilitiesData = [
            { id: 1, name: "Blindness", cat: "Visual", desc: "Total absence of sight or visual acuity not exceeding 3/60.", accommodation: "Braille textbooks, tactile maps, screen reader software (NVDA/JAWS)." },
            { id: 2, name: "Low Vision", cat: "Visual", desc: "Visual acuity not exceeding 6/18 up to 3/60 with best possible correction.", accommodation: "Large font test papers (18pt+), preferential front-row seating." },
            { id: 3, name: "Leprosy Cured Person", cat: "Physical", desc: "Cured of leprosy but suffering from loss of sensation or paresis.", accommodation: "Ergonomic pen grips, adaptive sports equipment, non-stigmatizing environment." },
            { id: 4, name: "Hearing Impairment", cat: "Sensory", desc: "Deaf (70dB loss) or Hard of Hearing (60-70dB loss in conversational frequencies).", accommodation: "Visual cue cards, lip-reading friendly seating, FM hearing system." },
            { id: 5, name: "Locomotor Disability", cat: "Physical", desc: "Inability to perform distinctive activities associated with movement of limbs.", accommodation: "Wheelchair ramps, accessible low-height desks, ground-floor classrooms." },
            { id: 6, name: "Dwarfism", cat: "Physical", desc: "Medical or genetic condition resulting in short stature (adult height < 4ft 10in).", accommodation: "Footrests, low-height lab benches and blackboard access." },
            { id: 7, name: "Intellectual Disability", cat: "Cognitive", desc: "Significant limitations in intellectual functioning & adaptive behavior.", accommodation: "Task-analyzed step-by-step instructions, concrete manipulatives, life-skills goals." },
            { id: 8, name: "Mental Illness", cat: "Psychosocial", desc: "Substantial disorder of thinking, mood, perception, orientation, or memory.", accommodation: "Quiet break areas, flexible exam schedules, school counselor coordination." },
            { id: 9, name: "Autism Spectrum Disorder", cat: "Cognitive", desc: "Neurodevelopmental condition affecting communication, social interaction & behavior.", accommodation: "Visual daily schedules, sensory quiet corner, clear structured routine." },
            { id: 10, name: "Cerebral Palsy", cat: "Physical", desc: "Group of non-progressive neurological conditions affecting body movement & posture.", accommodation: "Scribe for exams, compensatory time, speech-to-text software." },
            { id: 11, name: "Muscular Dystrophy", cat: "Physical", desc: "Group of hereditary genetic muscle diseases causing progressive weakness.", accommodation: "Elevator access, assistance for physical movement, extra time." },
            { id: 12, name: "Chronic Neurological Conditions", cat: "Physical", desc: "Conditions like Epilepsy, Alzheimer's, or Parkinson's severely impacting nervous system.", accommodation: "Seizure emergency care plan, rest breaks during academic sessions." },
            { id: 13, name: "Specific Learning Disabilities", cat: "Cognitive", desc: "Deficits in processing language (Dyslexia, Dysgraphia, Dyscalculia).", accommodation: "CBSE Scribe/Calculator provision, colored overlays, extended time." },
            { id: 14, name: "Multiple Sclerosis", cat: "Physical", desc: "Immune system attacks protective sheath covering nerve fibers causing communication issues.", accommodation: "Climate-controlled classroom, reduced fatigue assignments." },
            { id: 15, name: "Speech and Language Disability", cat: "Sensory", desc: "Permanent disability arising from conditions affecting speech/language.", accommodation: "AAC (Augmentative & Alternative Communication) boards, oral presentation alternatives." },
            { id: 16, name: "Thalassemia", cat: "Blood", desc: "Inherited blood disorder causing body to have less hemoglobin than normal.", accommodation: "Medical leave flexibilities, peer study notes support." },
            { id: 17, name: "Hemophilia", cat: "Blood", desc: "Inherited bleeding disorder where blood does not clot properly.", accommodation: "Safe playground supervision, non-sharp learning materials." },
            { id: 18, name: "Sickle Cell Disease", cat: "Blood", desc: "Inherited red blood cell disorder blocking blood flow and oxygen.", accommodation: "Hydration access at all times, temperature-controlled seating." },
            { id: 19, name: "Multiple Disabilities", cat: "Cognitive", desc: "Combination of two or more benchmark disabilities (e.g., Deaf-Blindness).", accommodation: "Multisensory communication systems, dual specialist IEP team." },
            { id: 20, name: "Acid Attack Victim", cat: "Physical", desc: "Disfigurement caused by acid violence with physical/psychological consequences.", accommodation: "Peer sensitivity workshops, psychological counseling, medical support." },
            { id: 21, name: "Parkinson's Disease", cat: "Physical", desc: "Progressive nervous system disorder affecting motor control and movement.", accommodation: "Weighted writing instruments, audio recording of class lectures." }
        ];

        function renderDisabilitiesExplorer(mount) {
            const categories = ['ALL', 'Visual', 'Physical', 'Sensory', 'Cognitive', 'Blood'];
            
            function filterCards(cat) {
                appState.activeExplorerFilter = cat;
                renderDisabilitiesExplorer(mount);
            }

            const filtered = appState.activeExplorerFilter === 'ALL' 
                ? disabilitiesData 
                : disabilitiesData.filter(d => d.cat === appState.activeExplorerFilter);

            mount.innerHTML = `
                <div class="space-y-4">
                    <!-- Category Filters -->
                    <div class="flex flex-wrap gap-1.5 text-xs">
                        ${categories.map(c => `
                            <button onclick="window.setDisabilityFilter('${c}')" class="px-3 py-1 rounded-lg font-bold transition ${
                                appState.activeExplorerFilter === c 
                                ? 'bg-teal-600 text-white shadow-xs' 
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }">${c}</button>
                        `).join('')}
                    </div>

                    <!-- Cards Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${filtered.map(d => `
                            <div id="disability-card-${d.id}" class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl hover:shadow-md transition">
                                <div class="flex items-center justify-between mb-1.5">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">${d.cat}</span>
                                    <span class="text-[10px] font-mono text-slate-400">#${d.id}</span>
                                </div>
                                <h5 class="font-bold text-slate-800 text-xs sm:text-sm">${d.name}</h5>
                                <p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${d.desc}</p>
                                
                                <button onclick="window.toggleDisabilityDetail(${d.id})" class="mt-2.5 text-[11px] font-bold text-teal-700 hover:text-teal-900 flex items-center gap-1">
                                    <span>View Accommodations</span> <i id="disability-icon-${d.id}" class="fa-solid fa-chevron-down text-[9px]"></i>
                                </button>
                                
                                <div id="disability-detail-${d.id}" class="hidden mt-2 pt-2 border-t border-slate-200 text-[11px] bg-white p-2.5 rounded-lg text-slate-700 space-y-1">
                                    <strong class="text-teal-950 block">CBSE / Classroom Accommodations:</strong>
                                    <p class="leading-relaxed text-slate-600">${d.accommodation}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            window.setDisabilityFilter = (cat) => {
                appState.activeExplorerFilter = cat;
                renderDisabilitiesExplorer(mount);
            };

            window.toggleDisabilityDetail = (id) => {
                const detail = document.getElementById(`disability-detail-${id}`);
                const icon = document.getElementById(`disability-icon-${id}`);
                const isHidden = detail.classList.contains('hidden');
                
                if (isHidden) {
                    detail.classList.remove('hidden');
                    icon.className = "fa-solid fa-chevron-up text-[9px]";
                } else {
                    detail.classList.add('hidden');
                    icon.className = "fa-solid fa-chevron-down text-[9px]";
                }
            };
        }

        // MODULE 2: What is an IEP & Team Roles
        function renderModule2(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200">
                        <h3 class="font-bold text-indigo-950 text-sm sm:text-base">What is an Individualized Education Program (IEP)?</h3>
                        <p class="text-xs text-slate-600 mt-1 leading-relaxed">
                            An IEP is a legally backed, written educational roadmap developed for a child with benchmark disabilities. In the Indian school context (CBSE/State/NIOS), it ensures equity by adapting the general curriculum without compromising fundamental standards.
                        </p>
                    </div>

                    <!-- Multidisciplinary Team Matrix Tool -->
                    <div>
                        <h4 class="font-bold text-indigo-950 text-sm mb-3 flex items-center gap-2">

                if (isCorrect) {
                    feedbackDiv.className = "text-xs p-3 rounded-lg mt-2 bg-emerald-100 text-emerald-900 border border-emerald-300 leading-relaxed";
                    feedbackDiv.innerHTML = `<strong><i class="fa-solid fa-circle-check mr-1"></i> Correct! (+50 XP)</strong><p class="mt-1">${exp}</p>`;

            } else if (viewName === 'flashcards-tool') {
                viewport.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-xl font-bold text-indigo-950 flex items-center gap-2">
                            <i class="fa-solid fa-clone text-saffron-600"></i> IEP Core Components Flashcards
                        </h2>
                        <div id="aux-mount"></div>
                    </div>
                `;
                renderFlashcardsTool(document.getElementById('aux-mount'));
            } else if (viewName === 'smart-builder-tool') {
                viewport.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-xl font-bold text-indigo-950 flex items-center gap-2">
                            <i class="fa-solid fa-bullseye text-emerald-600"></i> SMART IEP Goal Builder
                        </h2>
                        <div id="aux-mount"></div>
                    </div>
                `;
                renderSMARTBuilder(document.getElementById('aux-mount'));
            } else if (viewName === 'case-study-tool') {
                viewport.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-xl font-bold text-indigo-950 flex items-center gap-2">
                            <i class="fa-solid fa-briefcase text-purple-600"></i> Case Study Decision Engine
                        </h2>
                        <div id="aux-mount"></div>
                    </div>
                `;
                renderCaseStudyEngine(document.getElementById('aux-mount'));
            } else if (viewName === 'certificate-tool') {
                renderCertificate(viewport);
            }
        }

        function renderCertificate(container) {
            const date = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });

            container.innerHTML = `
                <div class="border-8 border-indigo-950 p-6 sm:p-10 rounded-2xl bg-gradient-to-b from-slate-50 to-amber-50/30 text-center space-y-6 shadow-xl relative overflow-hidden">
                    <div class="space-y-2">
                        <div class="inline-block p-3 bg-saffron-500 text-white rounded-full mb-1">
                            <i class="fa-solid fa-award text-3xl"></i>
                        </div>
                        <h2 class="text-xs uppercase tracking-widest text-saffron-600 font-bold">Certificate of Mastery</h2>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-indigo-950">Advanced Inclusive Education</h1>
                        <p class="text-xs text-slate-600">This certifies successful completion of the course module</p>
                    </div>

                    <div class="py-4 border-y border-slate-300 my-4">
                        <h3 class="text-lg sm:text-xl font-bold text-slate-800 underline decoration-saffron-500 decoration-2">IEP Foundations & Legal Framework</h3>
                        <p class="text-xs text-slate-600 mt-2">Indian Context: RTE Act 2009, RPwD Act 2016, SMART Goal Formulation & Multidisciplinary IEP Design</p>
                    </div>

                    <div class="flex flex-wrap justify-between items-center text-xs text-slate-600 pt-2 px-4 gap-4">
                        <div class="text-left">
                            <span class="block font-bold text-slate-800">Date Completed</span>
                            <span>${date}</span>
                        </div>
                        <div class="text-right">
                            <span class="block font-bold text-slate-800">XP Points Earned</span>
                            <span class="text-saffron-600 font-bold text-sm">${appState.xp} / 250 XP</span>
                        </div>
                    </div>

                    <div class="pt-6 no-print flex justify-center gap-3">
                        <button onclick="window.print()" class="px-5 py-2.5 bg-indigo-950 text-white text-xs font-bold rounded-xl hover:bg-indigo-900 transition flex items-center gap-2">
                            <i class="fa-solid fa-print"></i> Print / Save PDF
                        </button>
                        <button onclick="loadModule(0)" class="px-5 py-2.5 bg-slate-200 text-slate-800 text-xs font-bold rounded-xl hover:bg-slate-300 transition">
                            Back to Course
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
